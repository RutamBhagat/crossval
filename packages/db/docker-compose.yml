name: crossval

services:
  mongodb:
    image: mongo:8
    container_name: crossval-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - crossval_mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { rs.status().ok } catch { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''localhost:27017''}]}).ok }" | grep 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: crossval-redis
    ports:
      - "6379:6379"
    volumes:
      - crossval_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  crossval_mongodb_data:
  crossval_redis_data:
