name: Deploy server to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oci-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server check-types
      - run: pnpm --filter server test
      - run: pnpm --filter server build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        run: git archive --format=tar.gz --output=crossval-${{ github.sha }}.tar.gz HEAD

      - name: Configure SSH
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_oci
          chmod 600 ~/.ssh/id_oci
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload source
        run: |
          scp -i ~/.ssh/id_oci \
            "crossval-${{ github.sha }}.tar.gz" \
            "$OCI_USER@$OCI_HOST:/tmp/crossval-${{ github.sha }}.tar.gz"

      - name: Deploy release
        run: |
          ssh -i ~/.ssh/id_oci "$OCI_USER@$OCI_HOST" \
            'bash -s' -- "${{ github.sha }}" <<'DEPLOY'
          set -euo pipefail

          release_id="$1"
          root=/opt/crossval
          release="$root/releases/$release_id"
          archive="/tmp/crossval-$release_id.tar.gz"
          previous=$(readlink -f "$root/current" || true)

          rollback() {
            sudo journalctl -u crossval-server.service -n 100 --no-pager || true
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              ln -sfn "$previous" "$root/current.rollback"
              mv -Tf "$root/current.rollback" "$root/current"
              sudo systemctl restart crossval-server.service
            fi
            exit 1
          }

          sudo test -r "$root/server.env"
          rm -rf "$release"
          install -d "$release"
          tar -xzf "$archive" -C "$release"
          rm -f "$archive"

          cd "$release"
          sudo ./deploy/install-systemd-unit.sh
          pnpm install --frozen-lockfile
          pnpm --filter server build

          ln -sfn "$release" "$root/current.next"
          mv -Tf "$root/current.next" "$root/current"
          sudo systemctl restart crossval-server.service || rollback

          for _ in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1:8000/crossval/api/health >/dev/null; then
              for candidate in "$root"/releases/*; do
                [ -d "$candidate" ] || continue
                if [ "$candidate" != "$release" ] && [ "$candidate" != "$previous" ]; then
                  rm -rf "$candidate"
                fi
              done
              exit 0
            fi
            sleep 5
          done

          rollback
          DEPLOY
