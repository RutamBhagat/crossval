name: Deploy server to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oci-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server check-types
      - run: pnpm --filter server test
      - run: pnpm --filter server build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      OCI_HOST: a1
      OCI_USER: ${{ secrets.OCI_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: a1

      - name: Package source
        run: git archive --format=tar.gz --output=crossval-${{ github.sha }}.tar.gz HEAD

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host a1
            User ubuntu
            StrictHostKeyChecking accept-new
          EOF

      - name: Upload source
        run: |
          scp \
            "crossval-${{ github.sha }}.tar.gz" \
            "$OCI_USER@$OCI_HOST:/tmp/crossval-${{ github.sha }}.tar.gz"

      - name: Deploy release
        run: |
          ssh "$OCI_USER@$OCI_HOST" \
            'bash -s' -- "${{ github.sha }}" <<'DEPLOY'
          set -euo pipefail

          release_id="$1"
          root=/opt/crossval
          release="$root/releases/$release_id"
          archive="/tmp/crossval-$release_id.tar.gz"
          previous=$(readlink -f "$root/current" || true)

          rollback() {
            sudo journalctl -u crossval-server.service -n 100 --no-pager || true
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              ln -sfn "$previous" "$root/current.rollback"
              mv -Tf "$root/current.rollback" "$root/current"
              sudo systemctl restart crossval-server.service
            fi
            exit 1
          }

          sudo test -r "$root/server.env"
          rm -rf "$release"
          install -d "$release"
          tar -xzf "$archive" -C "$release"
          rm -f "$archive"

          cd "$release"
          sudo ./deploy/install-systemd-unit.sh
          pnpm install --frozen-lockfile
          pnpm --filter server build
          sudo /usr/bin/node \
            --env-file="$root/server.env" \
            "$release/apps/server/dist/scripts/create-rate-limit-indexes.mjs"

          ln -sfn "$release" "$root/current.next"
          mv -Tf "$root/current.next" "$root/current"
          sudo systemctl restart crossval-server.service || rollback

          health_host=$(sudo sed -n 's/^HOST=//p' "$root/server.env")
          health_port=$(sudo sed -n 's/^PORT=//p' "$root/server.env")

          for _ in $(seq 1 12); do
            if curl --fail --silent "http://${health_host:-0.0.0.0}:${health_port:-8000}/api/health" >/dev/null; then
              for candidate in "$root"/releases/*; do
                [ -d "$candidate" ] || continue
                if [ "$candidate" != "$release" ] && [ "$candidate" != "$previous" ]; then
                  rm -rf "$candidate"
                fi
              done
              exit 0
            fi
            sleep 5
          done

          rollback
          DEPLOY
