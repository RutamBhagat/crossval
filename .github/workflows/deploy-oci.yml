name: Deploy server to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oci-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crossval/server test
      - run: pnpm --filter @crossval/server check-types
      - run: pnpm --filter @crossval/server build

  deploy:
    needs: verify
    runs-on: ubuntu-24.04-arm
    environment: production
    env:
      OCI_HOST: a1
      OCI_USER: ${{ secrets.OCI_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --file apps/server/Dockerfile \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "crossval-server:${{ github.sha }}" \
            .

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: a1

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host a1
            User ubuntu
            StrictHostKeyChecking accept-new
          EOF

      - name: Transfer production image
        run: |
          docker save "crossval-server:${{ github.sha }}" |
            ssh "$OCI_USER@$OCI_HOST" 'sudo docker load'

      - name: Deploy release
        run: |
          ssh "$OCI_USER@$OCI_HOST" \
            'bash -s' -- "${{ github.sha }}" <<'DEPLOY'
          set -euo pipefail

          release_id="$1"
          root=/opt/crossval
          image="crossval-server:$release_id"
          current_image=crossval-server:current
          previous_image=crossval-server:previous
          container=crossval-server

          stop_container() {
            if sudo docker container inspect "$container" >/dev/null 2>&1; then
              sudo docker stop "$container" >/dev/null || true
              sudo docker rm "$container" >/dev/null || true
            fi
          }

          start_container() {
            sudo docker run --detach \
              --name "$container" \
              --restart unless-stopped \
              --stop-timeout 30 \
              --network host \
              --env-file "$root/server.env" \
              "$1" >/dev/null
          }

          rollback() {
            sudo docker logs --tail 100 "$container" 2>/dev/null || true
            stop_container

            if sudo docker image inspect "$previous_image" >/dev/null 2>&1; then
              sudo docker image rm "$current_image" >/dev/null 2>&1 || true
              sudo docker tag "$previous_image" "$current_image"
              start_container "$current_image" || true
            else
              printf 'No previous Docker image is available for rollback.\n' >&2
            fi
            exit 1
          }

          sudo test -r "$root/server.env"
          sudo docker version >/dev/null

          health_port=$(sudo sed -n 's/^PORT=//p' "$root/server.env")
          if [ "${health_port:-8000}" != 8000 ]; then
            printf 'Crossval Docker deployment requires PORT=8000; got %s.\n' "${health_port:-<unset>}" >&2
            exit 1
          fi

          sudo docker image inspect "$image" >/dev/null

          sudo docker run --rm \
            --env-file "$root/server.env" \
            "$image" \
            node dist/scripts/check-redis.mjs

          # One-time migration cleanup: Docker becomes the only API supervisor.
          if sudo systemctl is-active --quiet crossval-server.service || \
             sudo systemctl is-enabled --quiet crossval-server.service 2>/dev/null; then
            sudo systemctl disable --now crossval-server.service || true
          fi
          sudo rm -f /etc/systemd/system/crossval-server.service
          sudo systemctl daemon-reload

          if sudo docker image inspect "$current_image" >/dev/null 2>&1; then
            sudo docker image rm "$previous_image" >/dev/null 2>&1 || true
            sudo docker tag "$current_image" "$previous_image"
          fi

          sudo docker tag "$image" "$current_image"
          stop_container
          start_container "$current_image" || rollback

          for _ in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              current_id=$(sudo docker image inspect "$current_image" --format '{{.Id}}')
              previous_id=$(sudo docker image inspect "$previous_image" --format '{{.Id}}' 2>/dev/null || true)

              while read -r candidate; do
                [ -n "$candidate" ] || continue
                case "$candidate" in
                  "$current_image"|"$previous_image") continue ;;
                esac

                candidate_id=$(sudo docker image inspect "$candidate" --format '{{.Id}}')
                if [ "$candidate_id" != "$current_id" ] && [ "$candidate_id" != "$previous_id" ]; then
                  sudo docker image rm "$candidate" >/dev/null || true
                fi
              done < <(sudo docker image ls crossval-server --format '{{.Repository}}:{{.Tag}}')

              exit 0
            fi
            sleep 5
          done

          rollback
          DEPLOY
